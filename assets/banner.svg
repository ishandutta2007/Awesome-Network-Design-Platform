<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Glowing Node Gradient -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <!-- Accent Gradient for Text/Shapes -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
  </defs>

  <!-- Background Rect -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)" stroke="#312e81" stroke-width="2" />

  <!-- Dynamic Network Grid Lines (Background Dynamic Layer) -->
  <g opacity="0.15" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="200" y1="0" x2="200" y2="320" />
    <line x1="400" y1="0" x2="400" y2="320" />
    <line x1="600" y1="0" x2="600" y2="320" />
    <line x1="800" y1="0" x2="800" y2="320" />
    <line x1="1000" y1="0" x2="1000" y2="320" />
  </g>

  <!-- Dynamic Network Topology Connections & Pulse Animations (Background Dynamic Layer) -->
  <g opacity="0.4">
    <!-- Supply Routes with Animated Dash Offset -->
    <path d="M 150,220 Q 300,100 500,200 T 900,120 T 1100,240" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="8,8">
      <animate attributeName="stroke-dashoffset" from="100" to="0" dur="8s" repeatCount="indefinite" />
    </path>
    <path d="M 100,100 Q 400,280 700,150 T 1050,100" fill="none" stroke="#c084fc" stroke-width="2" stroke-dasharray="6,6">
      <animate attributeName="stroke-dashoffset" from="0" to="100" dur="10s" repeatCount="indefinite" />
    </path>

    <!-- Pulsing Node Glows -->
    <circle cx="150" cy="220" r="35" fill="url(#glow)">
      <animate attributeName="r" values="25;45;25" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle cx="500" cy="200" r="40" fill="url(#glow)">
      <animate attributeName="r" values="30;50;30" dur="5s" repeatCount="indefinite" />
    </circle>
    <circle cx="900" cy="120" r="35" fill="url(#glow)">
      <animate attributeName="r" values="20;40;20" dur="3.5s" repeatCount="indefinite" />
    </circle>

    <!-- Network Hub Nodes -->
    <circle cx="150" cy="220" r="6" fill="#38bdf8" />
    <circle cx="500" cy="200" r="8" fill="#818cf8" />
    <circle cx="900" cy="120" r="6" fill="#c084fc" />
    <circle cx="1100" cy="240" r="7" fill="#38bdf8" />
    <circle cx="100" cy="100" r="5" fill="#f43f5e" />
  </g>

  <!-- Foreground Title and Subtitle Layer (Guaranteed Visible) -->
  <g text-anchor="middle">
    <!-- Top Pill Badge -->
    <rect x="440" y="32" width="320" height="32" rx="16" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="600" y="53" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1">
      ⚡ AWESOME SUPPLY CHAIN ECOSYSTEM
    </text>

    <!-- Main Title -->
    <text x="600" y="125" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.5">
      Awesome Network Design Platform
    </text>

    <!-- Accent Line -->
    <rect x="450" y="148" width="300" height="4" rx="2" fill="url(#accentGrad)" />

    <!-- Subtitle -->
    <text x="600" y="195" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="400">
      Curated List of Enterprise SaaS Platforms &amp; Open-Source Optimization Engines
    </text>

    <!-- Key Topics Tags -->
    <g transform="translate(0, 230)">
      <!-- Tag 1 -->
      <rect x="270" y="0" width="140" height="28" rx="14" fill="#0f172a" stroke="#334155" />
      <text x="340" y="18" fill="#cbd5e1" font-family="sans-serif" font-size="12" font-weight="600">🏭 Facility Location</text>

      <!-- Tag 2 -->
      <rect x="425" y="0" width="150" height="28" rx="14" fill="#0f172a" stroke="#334155" />
      <text x="500" y="18" fill="#cbd5e1" font-family="sans-serif" font-size="12" font-weight="600">🚚 Route Optimization</text>

      <!-- Tag 3 -->
      <rect x="590" y="0" width="160" height="28" rx="14" fill="#0f172a" stroke="#334155" />
      <text x="670" y="18" fill="#cbd5e1" font-family="sans-serif" font-size="12" font-weight="600">📊 Scenario Modeling</text>

      <!-- Tag 4 -->
      <rect x="765" y="0" width="160" height="28" rx="14" fill="#0f172a" stroke="#334155" />
      <text x="845" y="18" fill="#cbd5e1" font-family="sans-serif" font-size="12" font-weight="600">🌐 Digital Twins</text>
    </g>
  </g>
</svg>
